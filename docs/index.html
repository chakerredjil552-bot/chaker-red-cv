<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23ffb547'/%3E%3Cstop offset='1' stop-color='%23ff6f91'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='%23120c2c'/%3E%3Ctext x='32' y='41' font-family='Arial%2CHelvetica%2Csans-serif' font-weight='800' font-size='26' text-anchor='middle' fill='url%28%23g%29'%3ECR%3C/text%3E%3C/svg%3E">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a living sky over the Aurès is painted behind the page and travels with the scroll (sunset at the top, night through the middle, dawn at Contact); night-tinted glass panels float above it and a glass dock steers between sections. */
:root{
  color-scheme:dark;
  --ink:#120c2c; --ink-2:#1b1540; --fg:#fbf3ea; --fg-2:#e6ddef; --muted:#b5acca; --faint:#7d7598;
  --sun:#ffb547; --rose:#ff6f91; --violet:#9b8cff; --dawn:#5eead4;
  --glass:rgba(255,255,255,.06); --glass-2:rgba(255,255,255,.13); --tint:rgba(20,14,46,.62);
  --stroke:rgba(255,255,255,.14); --hi:rgba(255,255,255,.5);
  --shadow:0 22px 50px -22px rgba(4,2,18,.85);
  --display:"Bricolage Grotesque","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
[dir=rtl] body{font-size:16px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sun);outline-offset:3px}

/* sky: the canvas the script paints */
.sky{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;pointer-events:none;display:block}

/* smoked glass: a night tint instead of a live blur, so scrolling stays smooth over the moving sky */
.lg{position:relative;background:linear-gradient(150deg,var(--glass-2),var(--glass) 45%,rgba(255,255,255,.02)),var(--tint);
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04),inset 0 0 22px rgba(255,255,255,.035),var(--shadow);isolation:isolate}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(240px circle at var(--mx,30%) var(--my,0%),rgba(255,236,214,.16),transparent 60%);opacity:.9;transition:opacity .3s}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(160deg,rgba(255,255,255,.55),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,200,170,.2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* only the small floating controls keep a real blur, since they sit over moving text */
.dock.lg,.seg.lg,.mono-mark.lg,.toast.lg,.top .btn.lg{-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:46px;padding-block:0;padding-inline:1.25em;border-radius:999px;
  font-weight:500;text-decoration:none;cursor:pointer;border:1px solid var(--stroke);transition:transform .45s var(--spring),background .3s,box-shadow .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.94)}
.btn svg{width:18px;height:18px;flex:none}
.btn.sun{background:linear-gradient(150deg,#ffcb73,#ff8f62);color:#2a1206;font-weight:600;border-color:rgba(255,220,170,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 14px 34px -12px rgba(255,140,80,.75)}
.btn.dawn{background:linear-gradient(150deg,rgba(94,234,212,.42),rgba(94,234,212,.14)),var(--tint);border-color:rgba(150,240,225,.45)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:36px;padding-inline:.9em;font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-family:var(--display);font-weight:800;font-size:16px;letter-spacing:-.02em;text-decoration:none}
.mono-mark b{background:linear-gradient(120deg,var(--sun),#fff 50%,var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent}
.mono-mark .ring{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--sun) calc(var(--p,0) * 1turn),rgba(255,255,255,.1) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
.top-right{display:flex;gap:8px;align-items:center}
.seg{position:relative;display:flex;padding:4px;border-radius:999px}
.seg button{position:relative;z-index:1;border:0;background:none;padding-block:7px;padding-inline:13px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--muted);transition:color .3s}
.seg button[aria-pressed=true]{color:var(--fg)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 14px rgba(0,0,0,.35);transition:left .55s var(--spring),width .55s var(--spring)}

/* page */
main{position:relative;z-index:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 140px}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:clamp(64px,10vw,110px)}
section{scroll-margin-top:84px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sun);display:flex;align-items:center;gap:10px}
[dir=rtl] .eyebrow{letter-spacing:0;font-family:var(--body);font-size:13px}
.eyebrow::before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--sun),var(--rose))}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.6vw,46px);line-height:1.06;letter-spacing:-.025em;margin:10px 0 0;text-wrap:balance}
[dir=rtl] h2{letter-spacing:0;line-height:1.3}
.sec-head{margin-bottom:26px}
.muted{color:var(--muted)}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:clamp(24px,5vw,56px);align-items:center;padding-top:clamp(18px,5vw,56px)}
.avatar{position:relative;width:clamp(150px,26vw,250px);aspect-ratio:1;max-width:100%;border-radius:50%;padding:5px}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--sun),var(--rose),var(--violet),var(--dawn),var(--sun));animation:spin 9s linear infinite}
.avatar::after{content:"";position:absolute;inset:-26px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,150,120,.45),rgba(155,140,255,.2) 62%,transparent);z-index:-1}
.avatar img{position:relative;display:block;width:100%;height:100%;object-fit:cover;border-radius:50%;border:4px solid var(--ink)}
@keyframes spin{to{transform:rotate(1turn)}}
.status{display:inline-flex;align-items:center;gap:9px;padding-block:7px;padding-inline:14px;border-radius:999px;font-size:13px;color:var(--fg)}
.dot{--pc:94,234,212;width:8px;height:8px;border-radius:50%;background:var(--dawn);box-shadow:0 0 0 0 rgba(var(--pc),.6);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(var(--pc),0)}100%{box-shadow:0 0 0 0 rgba(var(--pc),0)}}
.name{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,104px);line-height:.92;letter-spacing:-.045em;margin:18px 0 0}
.name span{display:block;background:linear-gradient(100deg,#fff8ef 30%,#ffd9a0 62%,#ff9fb6);-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] .name{letter-spacing:0;line-height:1.15;font-family:"Readex Pro",var(--display);font-weight:600}
.alt-name{font-family:var(--body);font-size:clamp(18px,2.4vw,24px);color:var(--muted);margin-top:8px}
.role{font-size:clamp(16px,2vw,19px);margin-top:16px;color:var(--fg);max-width:40ch;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.chip{display:inline-flex;align-items:center;gap:7px;padding-block:7px;padding-inline:13px;border-radius:999px;font-size:13px}
.chip svg{width:15px;height:15px;color:var(--sun)}
.chip b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.about{margin-top:clamp(28px,5vw,48px);border-radius:var(--r-lg);padding:clamp(20px,4vw,34px);font-size:clamp(16px,1.9vw,19px);line-height:1.7;max-width:none}
.about p{margin:0;max-width:68ch}
.hero-wrap{display:flex;flex-direction:column}

/* skills ribbon: runs on its own and speeds up with the scroll */
.mq{position:relative;overflow:hidden;overflow:clip;margin-block:calc(clamp(64px,10vw,110px) * -.4);padding-block:4px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-track{display:flex;align-items:center;width:max-content;will-change:transform}
.mq-i{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,64px);line-height:1.15;letter-spacing:-.03em;white-space:nowrap;padding-inline:.32em;color:var(--fg)}
.mq-i.o{color:transparent;-webkit-text-stroke:1.2px rgba(251,243,234,.6)}
.mq-s{color:var(--sun);font-size:clamp(16px,2.6vw,28px);line-height:1}
[dir=rtl] .mq-i{letter-spacing:0;font-family:"Readex Pro",var(--display);font-weight:600}

/* experience */
.xp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:56px;height:56px;border-radius:16px;flex:none;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.logo img{width:100%;height:100%;object-fit:cover}
.logo.mono{background:linear-gradient(140deg,var(--rose),var(--violet));font-family:var(--display);font-weight:800;font-size:22px;color:#fff}
.card h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;line-height:1.2;letter-spacing:-.01em}
[dir=rtl] .card h3{letter-spacing:0}
.card .sub{font-size:14px;color:var(--muted);margin-top:2px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-block:5px;padding-inline:10px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);color:var(--fg);align-self:flex-start}
[dir=rtl] .pill{font-family:var(--body);letter-spacing:0;font-size:12px}
.card p{margin:0;color:var(--fg-2);font-size:15px}
.card .foot{margin-top:auto;display:flex;justify-content:flex-start}
.link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg);text-decoration:none;border-bottom:1px solid rgba(255,181,71,.45);padding-bottom:2px;transition:border-color .3s,color .3s}
.link:hover{color:var(--sun);border-color:var(--sun)}
.link svg{width:14px;height:14px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* partners */
.partners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.partner{border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-decoration:none;transition:transform .5s var(--spring),border-color .3s}
.partner:hover{transform:translateY(-4px);border-color:rgba(255,181,71,.45)}
.partner:active{transform:scale(.97)}
.partner .logo{width:64px;height:64px;border-radius:50%}
.partner strong{font-family:var(--display);font-size:17px;line-height:1.2}
.partner .num{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.partner .num b{color:var(--fg);font-size:18px;font-weight:500}

/* videos */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(64vw,232px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px 14px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.vid{scroll-snap-align:start;position:relative;aspect-ratio:9/16;border-radius:24px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px;transition:transform .5s var(--spring);max-width:100%}
.vid:hover{transform:translateY(-4px)}
.vid:active{transform:scale(.97)}
.vid .glow{position:absolute;inset:0;z-index:-2;background:var(--g);opacity:.9;transition:transform 1.2s var(--spring)}
.vid:hover .glow{transform:scale(1.08)}
.vid .glow::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(18,12,44,0) 35%,rgba(18,12,44,.88))}
.vid .play{align-self:center;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin-top:auto;margin-bottom:auto}
.vid .play svg{width:24px;height:24px;margin-inline-start:4px}
.vid .client{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-block:5px;padding-inline:10px;border-radius:999px;align-self:flex-start}
.vid h3{font-size:15px;font-weight:500;margin:0;line-height:1.35}
.vid .w{font-size:12px;color:var(--fg-2);margin-top:6px;display:flex;align-items:center;gap:5px}
.vid .w svg{width:12px;height:12px}
.rail-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--stroke);transition:transform .45s var(--spring)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px}

/* project */
.proj{border-radius:var(--r-lg);padding:clamp(20px,4vw,30px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.app-icon{width:92px;height:92px;border-radius:24px;background:conic-gradient(from 210deg,var(--violet),var(--dawn),var(--sun),var(--rose),var(--violet));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 30px -10px rgba(155,140,255,.6)}
.app-icon svg{width:44px;height:44px;color:#fff}
.proj h3{font-family:var(--display);font-size:28px;margin:4px 0 6px;letter-spacing:-.02em}
.proj p{margin:0 0 16px;color:var(--fg-2);max-width:60ch}

/* education timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-inline-start:30px}
.tl::before{content:"";position:absolute;inset-inline-start:8px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(var(--sun),var(--rose) 45%,var(--violet))}
.tl-item{position:relative;border-radius:var(--r-md);padding-block:16px;padding-inline:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline}
.tl-item::before{content:"";position:absolute;inset-inline-start:-28px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--fg)}
.tl-item.now::before{--pc:255,181,71;background:var(--sun);border-color:var(--sun);box-shadow:0 0 0 0 rgba(var(--pc),.6);animation:ping 2.2s infinite}
.tl-item h3{font-family:var(--display);font-size:18px;margin:0;font-weight:700;line-height:1.3}
.tl-item .when{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-item .school{grid-column:1/-1;font-size:15px;color:var(--fg-2)}
.tl-item .note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tl-item .now-tag{color:var(--sun);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-inline-start:8px}

/* skills */
.skills{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.panel{border-radius:var(--r-lg);padding:22px;min-width:0}
.panel h3{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}
[dir=rtl] .panel h3{font-family:var(--body);letter-spacing:0;font-size:14px}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding-block:9px;padding-inline:14px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);transition:border-color .3s,background .3s}
.tag:hover{border-color:rgba(255,181,71,.5);background:rgba(255,181,71,.08)}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{border-radius:var(--r-sm);padding:12px 14px;background:rgba(255,255,255,.05);border:1px solid var(--stroke)}
.tool b{display:block;font-weight:500}
.tool span{font-size:12px;color:var(--muted)}
.langs{display:flex;flex-direction:column;gap:14px}
.lang-row .top-line{display:flex;justify-content:space-between;font-size:15px;gap:10px}
.lang-row .top-line span{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;overflow:clip}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sun),var(--rose));box-shadow:0 0 12px rgba(255,140,110,.5);transform-origin:left;animation:grow 1.4s var(--spring) both}
[dir=rtl] .bar i{transform-origin:right}
@keyframes grow{from{transform:scaleX(.15)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* contact */
.contact{border-radius:32px;padding:clamp(22px,5vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:center;overflow:hidden}
.contact::before{background:radial-gradient(400px circle at var(--mx,80%) var(--my,10%),rgba(255,181,71,.2),transparent 60%),radial-gradient(500px circle at 0% 100%,rgba(94,234,212,.14),transparent 60%)}
.contact h2{margin:10px 0 12px}
.contact p{margin:0;color:var(--fg-2);max-width:44ch}
.c-rows{display:flex;flex-direction:column;gap:10px}
.c-row{display:flex;align-items:center;gap:12px;border-radius:var(--r-md);padding:12px;padding-inline-start:14px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);min-width:0}
.c-row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.08);flex:none}
.c-row .ic svg{width:18px;height:18px}
.c-row .v{min-width:0;flex:1}
.c-row .v small{display:block;font-size:12px;color:var(--muted)}
.c-row .v a,.c-row .v span{display:block;font-family:var(--mono);font-size:14px;text-decoration:none;overflow-wrap:anywhere;user-select:all;font-variant-numeric:tabular-nums}
.c-row .ic.wa{background:rgba(94,234,212,.16);color:var(--dawn)}
footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:13px}

/* dock */
.dock{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:6px;display:flex;gap:2px;max-width:calc(100% - 24px)}
.dock button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;border-radius:999px;padding-block:8px;padding-inline:clamp(10px,3.4vw,18px);color:var(--muted);font-size:11px;transition:color .3s}
.dock button svg{width:21px;height:21px}
.dock button[aria-current=true]{color:var(--fg)}
.dock .ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08),0 6px 18px rgba(0,0,0,.4);transition:left .6s var(--spring),width .6s var(--spring)}

/* toast */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding-block:10px;padding-inline:18px;border-radius:999px;font-size:14px;transition:opacity .3s,transform .5s var(--spring);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* intro motion */
.rise{animation:rise .9s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* scroll-driven motion: browsers without scroll timelines show everything in place */
@keyframes rv{from{opacity:.3;translate:0 60px;scale:.95}to{opacity:1;translate:0 0;scale:1}}
@keyframes rvt{from{translate:0 70px;scale:.95}to{translate:0 0;scale:1}}
@keyframes shrink{to{scale:.72;rotate:-12deg}}
@keyframes fill{from{transform:scaleX(.08)}}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    .rv,.rvt{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 32%}
    .rvt{animation-name:rvt}
    .avatar{animation:rise .9s var(--spring) both,shrink linear both;animation-timeline:auto,view();animation-range:normal,exit 0% exit 100%}
    .bar i{animation:fill linear both;animation-timeline:view();animation-range:entry 20% cover 45%}
  }
}

@media (max-width:760px){
  .hero{grid-template-columns:1fr}
  .xp,.skills,.contact{grid-template-columns:1fr}
  .partners{grid-template-columns:repeat(2,minmax(0,1fr))}
  .proj{grid-template-columns:1fr}
  .dock button span{display:none}
  .dock button{padding-block:11px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

var io;
function observe(){
  if (io) io.disconnect();

  io = new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if (en.isIntersecting) setActive(en.target.getAttribute("data-nav")); });

}

    {p:.8,  top:[9,10,32],  mid:[22,28,74],  low:[40,66,124]},
    {p:1,   top:[14,14,44], mid:[32,48,98],  low:[76,156,152]}
  ];
  // ridgelines, far to near
  var RIDGES = [
    {base:.66, amp:.13, seed:11, step:8, rough:.5,  drift:.04},
    {base:.74, amp:.11, seed:23, step:7, rough:.55, drift:.07},
    {base:.82, amp:.09, seed:37, step:6, rough:.55, drift:.1},
    {base:.91, amp:.07, seed:53, step:5, rough:.6,  drift:.14}
  ];
  var BLOBS = [
    {x:.18, y:.3,  r:.55, c:[124,92,255], ph:0, a:function(p){ return .08 + .16 * bump(p, .12, .35, .75, .95); }},
    {x:.82, y:.55, r:.5,  c:[64,210,190], ph:2, a:function(p){ return .03 + .13 * bump(p, .35, .6, .9, 1.2); }},
    {x:.45, y:.85, r:.6,  c:[255,96,150], ph:4, a:function(p){ return .14 * (1 - ease(p / .35)) + .08 * ease((p - .8) / .2); }}
  ];
  var W = 0, H = 0, S = 1, lite = 0, ridges = [], stars = [], motes = [], moon = null, moonSize = 0, warm = null, cool = null;

  function rng(seed){ return function(){ seed = seed * 16807 % 2147483647; return (seed - 1) / 2147483646; }; }
  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function ease(v){ v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }
  function bump(p, a, b, c, d){ return ease((p - a) / (b - a)) * (1 - ease((p - c) / (d - c))); }
  function mix(a, b, t){ return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  function rgba(c, a){ return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + "," + (a == null ? 1 : a) + ")"; }
  function keyAt(p){
    for (var i = 1; i < KEYS.length; i++){
      if (p <= KEYS[i].p || i === KEYS.length - 1){
        var a = KEYS[i - 1], b = KEYS[i], t = ease((p - a.p) / (b.p - a.p));

      }
    }
  }
  function canvas(w, h){ var c = document.createElement("canvas"); c.width = w; c.height = h; return c; }
  function glowDot(c){
    var d = canvas(32, 32), x = d.getContext("2d"), g = x.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, rgba(c, 1)); g.addColorStop(.25, rgba(c, .5)); g.addColorStop(1, rgba(c, 0));
    x.fillStyle = g; x.fillRect(0, 0, 32, 32); return d;
  }
  function makeMoon(r){
    var s = Math.ceil(r * 6), m = s / 2, c = canvas(s, s), x = c.getContext("2d");
    var g = x.createRadialGradient(m, m, r * .8, m, m, r * 3);
    g.addColorStop(0, "rgba(255,236,204,.22)"); g.addColorStop(1, "rgba(255,236,204,0)");
    x.fillStyle = g; x.fillRect(0, 0, s, s);
    var d = canvas(s, s), y = d.getContext("2d");
    y.fillStyle = "#fff1d8"; y.beginPath(); y.arc(m, m, r, 0, 6.2832); y.fill();
    y.globalCompositeOperation = "destination-out"; y.beginPath(); y.arc(m + r * .42, m - r * .18, r * .92, 0, 6.2832); y.fill();
    x.drawImage(d, 0, 0); return c;
  }
  function ridge(L){
    var r = rng(L.seed), waves = [], norm = 0, span = W * 1.3, wl = Math.max(W, 720) * .75;
    for (var k = 0; k < 6; k++){ var v = {f:6.2832 / (wl / Math.pow(1.9, k) * (.8 + r() * .4)), a:Math.pow(L.rough, k), ph:r() * 6.2832, sharp:k >= 2}; waves.push(v); norm += v.a; }
    var amp = Math.min(H * L.amp, W * L.amp * .9), base = H * L.base, path = new Path2D();
    path.moveTo(-4, H * 1.6);
    for (var x = -4; x <= span + L.step; x += L.step){
      var y = 0;
      for (var i = 0; i < waves.length; i++){ var w = waves[i], s = Math.sin(x * w.f + w.ph); y += (w.sharp ? (.5 - Math.abs(s)) * 2 : s) * w.a; }
      path.lineTo(x, base - y / norm * amp);
    }
    path.lineTo(span + L.step, H * 1.6); path.closePath();
    return {path:path, top:base - amp, base:base};
  }
  function resize(){
    var w = cv.clientWidth, h = cv.clientHeight;
    if (!w || !h) return false;
    W = w; H = h;
    // pixel budget for the sharp layer; the lighter modes trade sharpness for speed
    var budget = [1e6, 5e5, 3e5][lite];
    S = Math.min(window.devicePixelRatio || 1, lite ? 1 : 1.5);
    if (W * H * S * S > budget) S = Math.sqrt(budget / (W * H));
    cv.width = Math.round(W * S); cv.height = Math.round(H * S);
    soft.width = Math.max(48, Math.round(W / 4)); soft.height = Math.max(48, Math.round(H / 4));
    ridges = RIDGES.map(ridge);
    moonSize = Math.max(14, Math.min(W, H) * .035) * 6; moon = makeMoon(moonSize * S / 6);
    var r = rng(7), n = Math.round(clamp(W * H / 7000, 70, 200)), i;
    stars = [];
    for (i = 0; i < n; i++) stars.push({x:r(), y:r(), z:.3 + r() * .7, s:r() < .1 ? 1.8 : .7 + r() * .8, a:.35 + r() * .65, ph:r() * 6.28, sp:.0006 + r() * .0018});
    motes = [];
    n = lite ? Math.round(clamp(W / 30, 10, 30)) : Math.round(clamp(W / 20, 18, 56));
    for (i = 0; i < n; i++) motes.push({x:r() * W, y:r() * H, z:.35 + r() * .65, s:5 + r() * 12, vy:.006 + r() * .02, ph:r() * 6.28, warm:r() < .55});
    if (!warm){ warm = glowDot([255,196,128]); cool = glowDot([140,244,226]); }
    return true;
  }

  function draw(p, y, now, dt, dy){
    if (cv.clientWidth !== W || cv.clientHeight !== H){ if (!resize()) return; }
    var k = keyAt(p), calm = reduceMotion, quiet = reduceMotion || lite > 1, i, g, R = Math.max(W, H);

    // soft layer at quarter size: sky gradient, drifting light, sun glow, dawn glow
    sctx.setTransform(soft.width / W, 0, 0, soft.height / H, 0, 0);
    sctx.globalCompositeOperation = "source-over";
    g = sctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, rgba(k.top)); g.addColorStop(.5, rgba(k.mid)); g.addColorStop(.9, rgba(k.low));
    sctx.fillStyle = g; sctx.fillRect(0, 0, W, H);
    sctx.globalCompositeOperation = "lighter";
    for (i = 0; i < BLOBS.length; i++){
      var b = BLOBS[i], a = b.a(p); if (a < .01) continue;
      var bx = (b.x + (quiet ? 0 : Math.sin(now * .00007 + b.ph) * .07)) * W;
      var by = (b.y - p * .35 + (quiet ? 0 : Math.cos(now * .00005 + b.ph) * .05)) * H;
      var br = b.r * R;
      g = sctx.createRadialGradient(bx, by, 0, bx, by, br);
      g.addColorStop(0, rgba(b.c, a)); g.addColorStop(1, rgba(b.c, 0));
      sctx.fillStyle = g; sctx.fillRect(bx - br, by - br, br * 2, br * 2);
    }
    var sa = 1 - ease((p - .1) / .14), sx = W * .74, sy0 = H * (.7 + .5 * ease(p / .2)), sr = Math.min(W, H) * .07;
    if (sa > .01){
      g = sctx.createRadialGradient(sx, sy0, sr * .5, sx, sy0, sr * 6);
      g.addColorStop(0, rgba([255,170,96], .5 * sa)); g.addColorStop(1, rgba([255,120,90], 0));
      sctx.fillStyle = g; sctx.fillRect(sx - sr * 6, sy0 - sr * 6, sr * 12, sr * 12);
    }
    var da = ease((p - .78) / .22);
    if (da > .01){
      var dx0 = W * .3, dy0 = H * .8, dr = R * .55;
      g = sctx.createRadialGradient(dx0, dy0, 0, dx0, dy0, dr);
      g.addColorStop(0, rgba([255,160,126], .32 * da)); g.addColorStop(1, rgba([255,160,126], 0));
      sctx.fillStyle = g; sctx.fillRect(dx0 - dr, dy0 - dr, dr * 2, dr * 2);
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    ctx.drawImage(soft, 0, 0, cv.width, cv.height);
    ctx.setTransform(S, 0, 0, S, 0, 0);

    // stars come out as the sun goes down and drift at different depths
    var sv = .12 + .88 * bump(p, .08, .3, .82, 1.04);
    if (sv > .02){
      var span = H * 1.3;
      ctx.globalCompositeOperation = "lighter";
      ctx.fillStyle = "#fff6e8";
      for (i = 0; i < stars.length; i++){
        var st = stars[i];
        var sy = ((st.y * span - y * .045 * st.z) % span + span) % span - H * .15;
        var fade = clamp((H * .78 - sy) / (H * .45), 0, 1);
        if (!fade) continue;
        ctx.globalAlpha = sv * st.a * fade * (quiet ? .8 : .6 + .4 * Math.sin(now * st.sp + st.ph));
        ctx.fillRect(st.x * W, sy, st.s, st.s);
      }
      ctx.globalAlpha = 1;
    }

    // crescent moon through the night
    var ma = bump(p, .3, .5, .8, .95);
    if (ma > .01){
      ctx.globalCompositeOperation = "lighter"; ctx.globalAlpha = ma;
      ctx.drawImage(moon, W * .2 - moonSize / 2, H * (.2 + (1 - ma) * .06) - moonSize / 2, moonSize, moonSize);
      ctx.globalAlpha = 1;
    }

    // the sun sets behind the ridges over the first screens
    ctx.globalCompositeOperation = "source-over";
    if (sa > .01){
      g = ctx.createRadialGradient(sx, sy0 - sr * .3, 0, sx, sy0, sr);
      g.addColorStop(0, rgba([255,238,196], sa)); g.addColorStop(1, rgba([255,166,92], sa));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sx, sy0, sr, 0, 6.2832); ctx.fill();
    }

    // ridgelines sink away as you scroll into the night and rise again for dawn; near ones move faster
    var u = calm ? 0 : (p < .5 ? ease(p / .3) : 1 - ease((p - .7) / .3));
    for (i = 0; i < ridges.length; i++){
      var rg = ridges[i], off = clamp(u * (1 + i * .4), 0, 1) * (H - rg.top + 30);
      if (rg.top + off >= H) continue;
      var c0 = mix(mix(k.low, k.mid, .25), k.top, .42 + i * .18), c1 = mix(c0, [5,4,16], .55);
      g = ctx.createLinearGradient(0, rg.top, 0, H);
      g.addColorStop(0, rgba(c0)); g.addColorStop(1, rgba(c1));
      ctx.save(); ctx.translate(calm ? 0 : -p * W * RIDGES[i].drift, off); ctx.fillStyle = g; ctx.fill(rg.path); ctx.restore();
    }

    // embers at sunset, cool fireflies at night; a fast scroll pushes them
    if (!quiet){
      ctx.globalCompositeOperation = "lighter";
      var wa = .25 + .75 * (1 - bump(p, .18, .4, .72, .92)), ca = .15 + .85 * bump(p, .18, .4, .8, 1.05), push = clamp(dy, -80, 80);
      for (i = 0; i < motes.length; i++){
        var m = motes[i];
        m.y -= m.vy * dt * m.z + push * .35 * m.z;
        m.x += Math.sin(now * .0007 + m.ph) * .12 * m.z * dt / 16;
        if (m.y < -20){ m.y = H + 20; m.x = Math.random() * W; }
        else if (m.y > H + 20){ m.y = -20; m.x = Math.random() * W; }
        var al = (m.warm ? wa : ca) * (.45 + .4 * Math.sin(now * .002 + m.ph)) * m.z;
        if (al < .02) continue;
        var sz = m.s * m.z;
        ctx.globalAlpha = al;
        ctx.drawImage(m.warm ? warm : cool, m.x - sz / 2, m.y - sz / 2, sz, sz);
      }
      ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    }
  }
  return {
    draw:draw,
    get lite(){ return lite; },
    lighten:function(){ if (lite < 2){ lite++; W = 0; } }
  };
})();

// the sky redraws every frame while the page scrolls and at 30 fps while it rests;
// if the real frame rate stays low, it steps down to a lighter mode
var lastT = 0, lastY = -1, vel = 0, drawnAt = 0, drawnY = -1, frameAvg = 16, frameCount = 0;
function tick(now){
  var de = document.documentElement;
  var y = window.pageYOffset || de.scrollTop || 0;
  var p = Math.min(1, Math.max(0, y / Math.max(1, de.scrollHeight - window.innerHeight)));

  var dy = lastY < 0 ? 0 : y - lastY;
  lastT = now; lastY = y;
  vel += (dy - vel) * .15;
  if (sky){
    if (!reduceMotion && gap < 100){
      frameAvg += (gap - frameAvg) * .05;
      if (++frameCount > 45 && frameAvg > 22 && sky.lite < 2){ sky.lighten(); frameCount = 0; frameAvg = 16; }
    }
    var moving = y !== drawnY, wait = sky.lite ? 30 : moving ? 14 : 30;
    if (reduceMotion || ((moving || sky.lite < 2) && now - drawnAt >= wait)){
      sky.draw(p, y, now, drawnAt ? Math.min(50, now - drawnAt) : 16, drawnY < 0 ? 0 : y - drawnY);
      drawnAt = now; drawnY = y;
    }
  }
  if (ringEl && Math.abs(p - ringP) > .002){ ringP = p; ringEl.style.setProperty("--p", p.toFixed(3)); }
  if (ribbon && ribbonHalf && !reduceMotion){
    var dir = de.dir === "rtl" ? 1 : -1;
    ribbonPos += .045 * Math.min(gap, 50) + Math.max(-40, Math.min(40, vel)) * .9;
    var x = (ribbonPos % ribbonHalf + ribbonHalf) % ribbonHalf;
    ribbonSkew += (Math.max(-9, Math.min(9, vel * .3)) * -dir - ribbonSkew) * .2;
    ribbon.style.transform = "translate3d(" + (dir * x).toFixed(1) + "px,0,0) skewX(" + ribbonSkew.toFixed(2) + "deg)";
  }
  if (!reduceMotion) requestAnimationFrame(tick);
}
if (reduceMotion){
  var tickQueued = false;
  var tickOnce = function(){ if (tickQueued) return; tickQueued = true; requestAnimationFrame(function(n){ tickQueued = false; drawnY = -1; tick(n); }); };
  window.addEventListener("scroll", tickOnce, {passive:true});
  window.addEventListener("resize", tickOnce);
  tickOnce();
} else requestAnimationFrame(tick);

render();

})();
</script>
