<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='%23ffb547'/%3E%3Cstop offset='1' stop-color='%23ff6f91'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='%23120c2c'/%3E%3Ctext x='32' y='41' font-family='Arial%2CHelvetica%2Csans-serif' font-weight='800' font-size='26' text-anchor='middle' fill='url%28%23g%29'%3ECR%3C/text%3E%3C/svg%3E">

<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: a black stage where a picture made of code characters lives behind the page (Michelangelo's two hands in the hero, a knight after the touch); black-glass panels with red hairlines float above it, a glass dock steers between sections. Palette is red, white and black only. */
:root{
  color-scheme:dark;
  --ink:#050505; --ink-2:#0e0d0d; --fg:#f6f4f4; --fg-2:#d6d1d1; --muted:#a39b9b; --faint:#6d6666;
  --red:#e3262f; --red-hi:#ff5c61; --red-lo:#8e0f17;
  --glass:rgba(255,255,255,.035); --glass-2:rgba(255,255,255,.08); --tint:rgba(5,5,5,.8);
  --stroke:rgba(227,38,47,.22); --hair:rgba(255,255,255,.1);
  --shadow:0 24px 50px -24px rgba(0,0,0,.9);
  --display:"Bricolage Grotesque","Readex Pro",system-ui,sans-serif;
  --body:"Readex Pro",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-lg:26px; --r-md:18px; --r-sm:12px;
  --spring:cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ink)}
body{background:var(--ink);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--ink)}
::selection{background:var(--red);color:#fff}
[dir=rtl] body{font-size:16px}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}

/* the canvas the script paints */
.bg{position:fixed;left:0;top:0;width:100%;height:100vh;height:100lvh;z-index:0;pointer-events:none;display:block;background:var(--ink)}

/* black glass with a red hairline; no live blur so scrolling stays smooth over the moving picture */
.lg{position:relative;background:linear-gradient(150deg,var(--glass-2),var(--glass) 45%,rgba(255,255,255,0)),var(--tint);
  border:1px solid var(--stroke);box-shadow:inset 0 1px 0 rgba(255,210,210,.16),var(--shadow);isolation:isolate}
.lg::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  background:radial-gradient(260px circle at var(--mx,30%) var(--my,0%),rgba(227,38,47,.14),transparent 60%);opacity:.9;transition:opacity .3s}
.lg::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(160deg,rgba(255,92,97,.55),rgba(255,92,97,0) 30%,rgba(255,92,97,0) 70%,rgba(255,92,97,.2));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
/* only the small floating controls keep a real blur, since they sit over moving text */
.dock.lg,.seg.lg,.mono-mark.lg,.toast.lg,.top .btn.lg{-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;min-height:46px;padding-block:0;padding-inline:1.25em;border-radius:999px;
  font-weight:500;text-decoration:none;cursor:pointer;border:1px solid var(--stroke);transition:transform .45s var(--spring),background .3s,box-shadow .3s,color .3s;white-space:nowrap}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:scale(.94)}
.btn svg{width:18px;height:18px;flex:none}
.btn.red{background:linear-gradient(150deg,var(--red-hi),var(--red) 55%,var(--red-lo));color:#fff;font-weight:600;border-color:rgba(255,170,170,.7);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 14px 34px -14px rgba(227,38,47,.8)}
.btn.line{background:var(--tint);color:var(--fg);border-color:rgba(227,38,47,.55)}
.btn.line:hover{background:rgba(227,38,47,.12)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.sm{min-height:36px;padding-inline:.9em;font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1080px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.mono-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;font-family:var(--mono);font-weight:500;font-size:14px;letter-spacing:.02em;text-decoration:none;color:var(--red-hi)}
.mono-mark .ring{position:absolute;inset:-4px;border-radius:50%;pointer-events:none;
  background:conic-gradient(var(--red) calc(var(--p,0) * 1turn),rgba(255,255,255,.1) 0);
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}
.top-right{display:flex;gap:8px;align-items:center}
.seg{position:relative;display:flex;padding:4px;border-radius:999px}
.seg button{position:relative;z-index:1;border:0;background:none;padding-block:7px;padding-inline:13px;border-radius:999px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;cursor:pointer;color:var(--muted);transition:color .3s}
.seg button[aria-pressed=true]{color:#fff}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:linear-gradient(150deg,var(--red-hi),var(--red));box-shadow:0 4px 14px rgba(0,0,0,.4);transition:left .55s var(--spring),width .55s var(--spring)}

/* page */
main{position:relative;z-index:1;overflow-x:clip;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 140px}
.wrap{max-width:1080px;margin-inline:auto;display:flex;flex-direction:column;gap:clamp(64px,10vw,110px)}
section{scroll-margin-top:84px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);display:flex;align-items:center;gap:10px}
[dir=rtl] .eyebrow{letter-spacing:0;font-family:var(--body);font-size:13px}
.eyebrow::before{content:"//";letter-spacing:0;color:var(--red-lo)}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,4.6vw,46px);line-height:1.06;letter-spacing:-.025em;margin:10px 0 0;text-wrap:balance;text-shadow:0 2px 24px #000}
[dir=rtl] h2{letter-spacing:0;line-height:1.3}
.sec-head{margin-bottom:26px}
.muted{color:var(--muted)}

/* hero: text over the two hands */
.hero-wrap{position:relative;display:flex;flex-direction:column;min-height:calc(100svh - 90px);justify-content:space-between;gap:28px;padding-bottom:96px}
.hero-wrap::before{content:"";position:absolute;inset:-40px 0 30% 0;z-index:-1;pointer-events:none;background:radial-gradient(70% 60% at 22% 40%,rgba(5,5,5,.78),rgba(5,5,5,0) 72%)}
.hero{display:flex;flex-direction:column;align-items:flex-start;padding-top:clamp(24px,8vw,90px)}
.status{display:inline-flex;align-items:center;gap:9px;padding-block:7px;padding-inline:14px;border-radius:999px;font-size:13px;color:var(--fg)}
.dot{--pc:227,38,47;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(var(--pc),.6);animation:ping 2.2s infinite}
@keyframes ping{70%{box-shadow:0 0 0 9px rgba(var(--pc),0)}100%{box-shadow:0 0 0 0 rgba(var(--pc),0)}}
.name{font-family:var(--display);font-weight:800;font-size:clamp(52px,11vw,132px);line-height:.9;letter-spacing:-.05em;margin:20px 0 0;filter:drop-shadow(0 4px 22px rgba(0,0,0,.9))}
.name span{display:block;background:linear-gradient(100deg,#ffffff 30%,var(--red-hi) 60%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
[dir=rtl] .name{letter-spacing:0;line-height:1.15;font-family:"Readex Pro",var(--display);font-weight:600}
.alt-name{font-family:var(--body);font-size:clamp(18px,2.4vw,24px);color:var(--red);margin-top:10px;text-shadow:0 2px 16px #000}
.role{font-size:clamp(16px,2vw,20px);margin-top:14px;color:var(--fg);max-width:42ch;text-wrap:balance;text-shadow:0 2px 16px #000}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.chip{display:inline-flex;align-items:center;gap:7px;padding-block:7px;padding-inline:13px;border-radius:999px;font-size:13px}
.chip svg{width:15px;height:15px;color:var(--red)}
.chip b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.credit{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--faint);align-self:flex-end;text-shadow:0 1px 8px #000}
[dir=rtl] .credit{letter-spacing:0;font-family:var(--body);font-size:12px}
.about{border-radius:var(--r-lg);padding:clamp(20px,4vw,34px);font-size:clamp(16px,1.9vw,19px);line-height:1.7}
.about p{margin:0;max-width:68ch}

/* the interlude: empty room for the touch, the code rain and the knight */
.interlude{position:relative;min-height:120svh;display:flex;flex-direction:column;justify-content:flex-end}

/* skills ribbon: runs on its own and speeds up with the scroll */
.mq{position:relative;overflow:hidden;overflow:clip;padding-block:4px;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq-track{display:flex;align-items:center;width:max-content;will-change:transform}
.mq-i{font-family:var(--display);font-weight:800;font-size:clamp(30px,6vw,64px);line-height:1.15;letter-spacing:-.03em;white-space:nowrap;padding-inline:.32em;color:var(--fg)}
.mq-i.o{color:transparent;-webkit-text-stroke:1.2px var(--red)}
.mq-s{color:var(--red);font-family:var(--mono);font-size:clamp(16px,2.6vw,28px);line-height:1}
[dir=rtl] .mq-i{letter-spacing:0;font-family:"Readex Pro",var(--display);font-weight:600}

/* experience */
.xp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card-head{display:flex;gap:14px;align-items:center;min-width:0}
.logo{width:56px;height:56px;border-radius:16px;flex:none;overflow:hidden;background:#fff;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.logo img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.05);transition:filter .5s}
.card:hover .logo img,.partner:hover .logo img{filter:none}
.logo.mono{background:linear-gradient(140deg,var(--red-hi),var(--red-lo));font-family:var(--mono);font-weight:500;font-size:20px;color:#fff}
.card h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0;line-height:1.2;letter-spacing:-.01em}
[dir=rtl] .card h3{letter-spacing:0}
.card .sub{font-size:14px;color:var(--red);margin-top:2px}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding-block:5px;padding-inline:10px;border-radius:999px;background:rgba(227,38,47,.08);border:1px solid var(--stroke);color:var(--fg);align-self:flex-start}
[dir=rtl] .pill{font-family:var(--body);letter-spacing:0;font-size:12px}
.card p{margin:0;color:var(--fg-2);font-size:15px}
.card .foot{margin-top:auto;display:flex;justify-content:flex-start}
.link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--fg);text-decoration:none;border-bottom:1px solid rgba(227,38,47,.5);padding-bottom:2px;transition:border-color .3s,color .3s}
.link:hover{color:var(--red-hi);border-color:var(--red-hi)}
.link svg{width:14px;height:14px}
[dir=rtl] .flip{transform:scaleX(-1)}

/* partners */
.partners{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.partner{border-radius:var(--r-md);padding:18px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-decoration:none;transition:transform .5s var(--spring),border-color .3s}
.partner:hover{transform:translateY(-4px);border-color:rgba(255,92,97,.6)}
.partner:active{transform:scale(.97)}
.partner .logo{width:64px;height:64px;border-radius:50%}
.partner strong{font-family:var(--display);font-size:17px;line-height:1.2}
.partner .num{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.partner .num b{color:var(--red-hi);font-size:18px;font-weight:500}

/* videos */
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(64vw,232px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-block:6px 14px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.vid{scroll-snap-align:start;position:relative;aspect-ratio:9/16;border-radius:22px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px;transition:transform .5s var(--spring);max-width:100%}
.vid:hover{transform:translateY(-4px)}
.vid:active{transform:scale(.97)}
.vid .glow{position:absolute;inset:0;z-index:-2;background:var(--g);transition:transform 1.2s var(--spring)}
.vid:hover .glow{transform:scale(1.08)}
.vid .glow::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.35) 0 1px,transparent 1px 4px);mix-blend-mode:multiply}
.vid .glow::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,5,5,0) 35%,rgba(5,5,5,.92))}
.vid .play{align-self:center;width:66px;height:66px;border-radius:50%;display:grid;place-items:center;margin-top:auto;margin-bottom:auto;color:var(--red-hi)}
.vid .play svg{width:24px;height:24px;margin-inline-start:4px}
.vid .client{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding-block:5px;padding-inline:10px;border-radius:999px;align-self:flex-start}
.vid h3{font-size:15px;font-weight:500;margin:0;line-height:1.35}
.vid .w{font-size:12px;color:var(--red);margin-top:6px;display:flex;align-items:center;gap:5px}
.vid .w svg{width:12px;height:12px}
.rail-nav{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;border:1px solid var(--stroke);color:var(--red-hi);transition:transform .45s var(--spring)}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:18px;height:18px}

/* project */
.proj{border-radius:var(--r-lg);padding:clamp(20px,4vw,30px);display:grid;grid-template-columns:auto minmax(0,1fr);gap:22px;align-items:center}
.app-icon{width:92px;height:92px;border-radius:24px;background:conic-gradient(from 210deg,var(--red-hi),var(--red-lo),#1c1a1a,var(--red),var(--red-hi));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 14px 30px -10px rgba(227,38,47,.55)}
.app-icon svg{width:44px;height:44px;color:#fff}
.proj h3{font-family:var(--display);font-size:28px;margin:4px 0 6px;letter-spacing:-.02em}
.proj p{margin:0 0 16px;color:var(--fg-2);max-width:60ch}

/* education timeline */
.tl{position:relative;display:flex;flex-direction:column;gap:14px;padding-inline-start:30px}
.tl::before{content:"";position:absolute;inset-inline-start:8px;top:10px;bottom:10px;width:2px;border-radius:2px;background:linear-gradient(var(--red),rgba(255,255,255,.25))}
.tl-item{position:relative;border-radius:var(--r-md);padding-block:16px;padding-inline:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:baseline}
.tl-item::before{content:"";position:absolute;inset-inline-start:-28px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--ink);border:2px solid var(--fg)}
.tl-item.now::before{--pc:227,38,47;background:var(--red);border-color:var(--red);box-shadow:0 0 0 0 rgba(var(--pc),.6);animation:ping 2.2s infinite}
.tl-item h3{font-family:var(--display);font-size:18px;margin:0;font-weight:700;line-height:1.3}
.tl-item .when{font-family:var(--mono);font-size:13px;color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.tl-item .school{grid-column:1/-1;font-size:15px;color:var(--fg-2)}
.tl-item .note{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tl-item .now-tag{color:var(--red);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-inline-start:8px}

/* skills */
.skills{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.panel{border-radius:var(--r-lg);padding:22px;min-width:0}
.panel h3{font-family:var(--mono);font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin:0 0 14px}
[dir=rtl] .panel h3{font-family:var(--body);letter-spacing:0;font-size:14px}
.cloud{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding-block:9px;padding-inline:14px;border-radius:999px;font-size:14px;background:rgba(255,255,255,.04);border:1px solid var(--hair);transition:border-color .3s,background .3s,color .3s}
.tag:hover{border-color:var(--red);background:var(--red);color:#fff}
.tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tool{border-radius:var(--r-sm);padding:12px 14px;background:rgba(255,255,255,.03);border:1px solid var(--hair)}
.tool b{display:block;font-weight:500}
.tool span{font-size:12px;color:var(--muted)}
.langs{display:flex;flex-direction:column;gap:14px}
.lang-row .top-line{display:flex;justify-content:space-between;font-size:15px;gap:10px}
.lang-row .top-line span{color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.08);margin-top:7px;overflow:hidden;overflow:clip}
.bar i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--red-lo),var(--red-hi));box-shadow:0 0 12px rgba(227,38,47,.5);transform-origin:left;animation:grow 1.4s var(--spring) both}
[dir=rtl] .bar i{transform-origin:right}
@keyframes grow{from{transform:scaleX(.15)}}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}

/* contact */
.contact{border-radius:30px;padding:clamp(22px,5vw,44px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:center;overflow:hidden}
.contact::before{background:radial-gradient(420px circle at var(--mx,80%) var(--my,10%),rgba(227,38,47,.2),transparent 60%),radial-gradient(520px circle at 0% 100%,rgba(255,255,255,.06),transparent 60%)}
.contact h2{margin:10px 0 12px}
.contact p{margin:0;color:var(--fg-2);max-width:44ch}
.c-rows{display:flex;flex-direction:column;gap:10px}
.c-row{display:flex;align-items:center;gap:12px;border-radius:var(--r-md);padding:12px;padding-inline-start:14px;background:rgba(255,255,255,.03);border:1px solid var(--hair);min-width:0}
.c-row .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--fg);flex:none}
.c-row .ic svg{width:18px;height:18px}
.c-row .v{min-width:0;flex:1}
.c-row .v small{display:block;font-size:12px;color:var(--muted)}
.c-row .v a,.c-row .v span{display:block;font-family:var(--mono);font-size:14px;text-decoration:none;overflow-wrap:anywhere;user-select:all;font-variant-numeric:tabular-nums}
.c-row .ic.wa{background:rgba(227,38,47,.16);color:var(--red-hi)}
footer{margin-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;color:var(--fg-2);font-size:13px}
footer>span{background:var(--tint);border:1px solid var(--hair);border-radius:999px;padding-block:7px;padding-inline:14px}

/* dock */
.dock{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));border-radius:999px;padding:6px;display:flex;gap:2px;max-width:calc(100% - 24px)}
.dock button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;border-radius:999px;padding-block:8px;padding-inline:clamp(10px,3.4vw,18px);color:var(--muted);font-size:11px;transition:color .3s}
.dock button svg{width:21px;height:21px}
.dock button[aria-current=true]{color:#fff}
.dock .ind{position:absolute;top:6px;bottom:6px;left:0;border-radius:999px;background:linear-gradient(150deg,var(--red-hi),var(--red));box-shadow:0 6px 18px rgba(0,0,0,.45);transition:left .6s var(--spring),width .6s var(--spring)}

/* toast */
.toast{position:fixed;z-index:60;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;padding-block:10px;padding-inline:18px;border-radius:999px;font-size:14px;transition:opacity .3s,transform .5s var(--spring);pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* intro motion */
.rise{animation:rise .9s var(--spring) both}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* scroll-driven motion: browsers without scroll timelines show everything in place */
@keyframes rv{from{opacity:.3;translate:0 60px;scale:.95}to{opacity:1;translate:0 0;scale:1}}
@keyframes rvt{from{translate:0 70px;scale:.95}to{translate:0 0;scale:1}}
@keyframes fill{from{transform:scaleX(.08)}}
@keyframes edge{from{background-position:-100% 0}to{background-position:200% 0}}
@keyframes lift{to{translate:0 -12vh;opacity:.15}}
@keyframes flyL{from{opacity:.1;translate:-46vw 0 -1200px;rotate:y 34deg}to{opacity:1;translate:0 0 0;rotate:y 0deg}}
@keyframes flyR{from{opacity:.1;translate:46vw 0 -1200px;rotate:y -34deg}to{opacity:1;translate:0 0 0;rotate:y 0deg}}
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    .rv,.rvt{animation:rv linear both;animation-timeline:view();animation-range:entry 0% cover 32%}
    .rvt{animation-name:rvt}
    .bar i{animation:fill linear both;animation-timeline:view();animation-range:entry 20% cover 45%}
    .hero{animation:lift linear both;animation-timeline:view();animation-range:exit 10% exit 100%}
    .xp,.partners,.tl,.skills,.stack,#projects,#about,#contact{perspective:1300px}
    .xp>.card:nth-child(odd),.partners>.partner:nth-child(odd),.tl>.tl-item:nth-child(odd),.skills>.panel,#about .about,.contact{animation-name:flyL;animation-range:entry 0% cover 42%}
    .xp>.card:nth-child(even),.partners>.partner:nth-child(even),.tl>.tl-item:nth-child(even),.stack>.panel,.proj{animation-name:flyR;animation-range:entry 0% cover 42%}
    .card::after,.panel::after,.tl-item::after,.proj::after{background:linear-gradient(90deg,transparent 0 35%,rgba(255,150,150,.95) 50%,transparent 65% 100%),linear-gradient(160deg,rgba(255,92,97,.45),rgba(255,92,97,0) 30%,rgba(255,92,97,0) 70%,rgba(255,92,97,.18));background-size:300% 100%,100% 100%;background-repeat:no-repeat;animation:edge linear both;animation-timeline:view();animation-range:entry 10% cover 50%}
  }
}

@media (max-width:760px){
  .xp,.skills,.contact{grid-template-columns:1fr}
  .partners{grid-template-columns:repeat(2,minmax(0,1fr))}
  .proj{grid-template-columns:1fr}
  .dock button span{display:none}
  .dock button{padding-block:11px}
  .credit{align-self:flex-start}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
</style>

    return true;
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (W) atlas(); });

  function clamp(v, a, b){ return v < a ? a : v > b ? b : v; }
  function ease(v){ v = clamp(v, 0, 1); return v * v * (3 - 2 * v); }

  // s: the scroll story, all 0..1 — a: fly into the hands, touch: the moment the fingers meet,
  // dis: hands break apart, rain: code rain, k: the knight decodes, kz: the camera closes in on him
  function draw(s, now, ptr, look, vel){
    if (cv.clientWidth !== W || cv.clientHeight !== H){ if (!resize()) return; }
    var t = now / 1000, aspect = (cols * cw) / (rows * chh);
    var showH = s.dis < 1, showK = s.k > 0;
    // hands camera: wide enough to show both hands, then a long push into the gap
    var hd0 = Math.max(2.6 * 1.8 / aspect, 2.35 * 1.8), hd = hd0 * Math.pow(.07, ease(s.a));
    var hy = hd * .3 * (1 - ease(s.a));
    var gap = .16 * (1 - ease(s.touch)) + .012 + (reduceMotion ? 0 : Math.sin(t * .9) * .008 * (1 - s.touch));
    // knight camera: close on his helmet first, then one full turn while pulling back to the whole picture
    var kz = ease(s.kz);
    var kFull = Math.max(1.05 * 1.8, KA * 1.04 * 1.8 / aspect), kNear = kFull * .42;
    var kd = kNear * Math.pow(kFull * 1.1 / kNear, kz) * (1.12 - .12 * ease(s.k));
    var kx = -.05 * (1 - kz), ky = .32 * (1 - kz);
    var yaw = Math.PI * 2 * kz + look[0] * .16;

    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, hcols, hrows);
    gl.useProgram(P1);
    gl.uniform2f(U1.uGrid, hcols, hrows); gl.uniform1f(U1.uAspect, aspect); gl.uniform1f(U1.uTime, reduceMotion ? 0 : t);
    gl.uniform1f(U1.uGap, gap); gl.uniform1f(U1.uHD, hd); gl.uniform1f(U1.uHY, hy);

    gl.uniform2f(U1.uOn, showH ? 1 : 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.useProgram(P2);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, sceneTex); gl.uniform1i(U2.uScene, 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, atlasTex); gl.uniform1i(U2.uAtlas, 1);
    gl.uniform2f(U2.uRes, cv.width, cv.height); gl.uniform2f(U2.uCell, cw, chh); gl.uniform2f(U2.uGrid, cols, rows);
    gl.uniform1f(U2.uN, N); gl.uniform1f(U2.uTime, t);
    gl.uniform1f(U2.uHands, showH ? 1 : 0); gl.uniform1f(U2.uDis, s.dis * 1.12); gl.uniform1f(U2.uKnight, s.k * 1.2);
    gl.uniform1f(U2.uRain, s.rain); gl.uniform1f(U2.uSpark, s.spark); gl.uniform1f(U2.uVel, clamp(vel, -1, 1)); gl.uniform1f(U2.uCalm, reduceMotion ? 1 : 0);
    gl.uniform3f(U2.uPtr, ptr[0] * dpr, ptr[1] * dpr, ptr[2] * dpr);
    var cardPx = cv.height * 1.8 / kd;
    gl.uniform1f(U2.uAspect, aspect); gl.uniform2f(U2.uHGrid, hcols, hrows);
    gl.uniform1f(U2.uKD, kd); gl.uniform1f(U2.uKX, kx); gl.uniform1f(U2.uKY, ky); gl.uniform1f(U2.uKYaw, yaw); gl.uniform1f(U2.uKA, KA); gl.uniform1f(U2.uKReady, knightReady);
    gl.uniform2f(U2.uFoot, cw / (cardPx * KA), chh / cardPx);
    gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, knightTex); gl.uniform1i(U2.uKT, 2);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  return {
    draw:draw,
    get lite(){ return lite; },
    lighten:function(){ if (lite < 1){ lite++; W = 0; } }
  };
})();

// the scroll story, measured against the hero and the interlude below it
function story(y, vh){
  var de = document.documentElement, top = 0, h = vh;
  if (interEl){ var r = interEl.getBoundingClientRect(); top = r.top + y; h = Math.max(1, r.height); }
  var c = function(v){ return v < 0 ? 0 : v > 1 ? 1 : v; };
  var a = c(y / Math.max(1, top + h * .3));
  var touch = c((y - (top - vh * .2)) / (vh * .45 + h * .15));
  var dis = c((y - (top + h * .18)) / (h * .22));
  var spark = c((y - (top + h * .12)) / (h * .32));
  var rain = Math.min(c((y - (top + h * .1)) / (h * .15)), 1 - c((y - (top + h * .55)) / (h * .25)));
  var k = c((y - (top + h * .3)) / (h * .38));
  var rest = Math.max(1, de.scrollHeight - vh - (top + h * .7));
  var kz = c((y - (top + h * .7)) / rest);
  return {a:a, touch:touch, dis:dis, spark:spark, rain:rain, k:k, kz:kz};
}

// pointer: the mouse, or a finger while it touches the screen
var ptrX = -999, ptrY = -999, ptrR = 0, ptrT = 0, ptrOn = false, lookX = 0, lookY = 0;
function ptrMove(x, y){ ptrX = x; ptrY = y; ptrOn = true; ptrT = performance.now(); }
window.addEventListener("pointermove", function(e){ ptrMove(e.clientX, e.clientY); }, {passive:true});
window.addEventListener("pointerdown", function(e){ ptrMove(e.clientX, e.clientY); }, {passive:true});
window.addEventListener("touchmove", function(e){ if (e.touches[0]) ptrMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
document.addEventListener("mouseleave", function(){ ptrOn = false; });
window.addEventListener("touchend", function(){ ptrOn = false; }, {passive:true});

// draws every frame while something moves, 30 fps while the page rests; steps down to a lighter mode if frames run slow
var lastT = 0, lastY = -1, vel = 0, drawnAt = 0, frameAvg = 16, frameCount = 0;
function tick(now){
  var de = document.documentElement, vh = window.innerHeight;
  var y = window.pageYOffset || de.scrollTop || 0;
  var p = Math.min(1, Math.max(0, y / Math.max(1, de.scrollHeight - vh)));
  var gap = lastT ? now - lastT : 16;
  var dy = lastY < 0 ? 0 : y - lastY;
  lastT = now; lastY = y;
  vel += (dy - vel) * .15;
  var idle = now - ptrT > 2500;
  ptrR += (((ptrOn && !idle) ? Math.max(70, Math.min(140, window.innerWidth * .11)) : 0) - ptrR) * .14;
  if (art){
    if (!reduceMotion && gap < 100){
      frameAvg += (gap - frameAvg) * .05;
      if (++frameCount > 60 && frameAvg > 24 && art.lite < 1){ art.lighten(); frameCount = 0; frameAvg = 16; }
    }
    var tx = ptrOn ? (ptrX / window.innerWidth - .5) * 2 : 0, ty = ptrOn ? (.5 - ptrY / vh) * 2 : 0;
    lookX += (tx - lookX) * .06; lookY += (ty - lookY) * .06;
    var busy = Math.abs(dy) > .5 || ptrR > 1 || Math.abs(vel) > .5;
    if (reduceMotion || now - drawnAt >= (busy ? 14 : 30)){
      art.draw(story(y, vh), now, [ptrX, ptrY, ptrR], [lookX, lookY], vel / 60);
      drawnAt = now;
    }
  }
  if (ringEl && Math.abs(p - ringP) > .002){ ringP = p; ringEl.style.setProperty("--p", p.toFixed(3)); }
  if (ribbon && ribbonHalf && !reduceMotion){
    var dir = de.dir === "rtl" ? 1 : -1;
    ribbonPos += .045 * Math.min(gap, 50) + Math.max(-40, Math.min(40, vel)) * .9;
    var x = (ribbonPos % ribbonHalf + ribbonHalf) % ribbonHalf;
    ribbonSkew += (Math.max(-9, Math.min(9, vel * .3)) * -dir - ribbonSkew) * .2;
    ribbon.style.transform = "translate3d(" + (dir * x).toFixed(1) + "px,0,0) skewX(" + ribbonSkew.toFixed(2) + "deg)";
  }
  if (!reduceMotion) requestAnimationFrame(tick);
}
if (reduceMotion){
  var tickQueued = false;
  var tickOnce = function(){ if (tickQueued) return; tickQueued = true; requestAnimationFrame(function(n){ tickQueued = false; tick(n); }); };
  window.addEventListener("scroll", tickOnce, {passive:true});
  window.addEventListener("resize", tickOnce);
  window.addEventListener("pointermove", tickOnce, {passive:true});
  tickOnce();
} else requestAnimationFrame(tick);

/* headings decode from random code characters the first time they scroll into view */
var decodeIO = null;
var CODE = "01{}[]<>/\\|=+*#%&$@;:";
function decodeBind(){
  if (decodeIO) decodeIO.disconnect();
  if (reduceMotion || lang === "ar" || !("IntersectionObserver" in window)) return;
  decodeIO = new IntersectionObserver(function(en){
    en.forEach(function(e){
      if (!e.isIntersecting) return;
      decodeIO.unobserve(e.target);
      var el = e.target, final = el.textContent, start = performance.now(), dur = 900;
      el.setAttribute("aria-label", final);
      (function step(now){
        var k = Math.min(1, (now - start) / dur), n = Math.floor(final.length * k), out = final.slice(0, n);
        for (var i = n; i < final.length; i++) out += final[i] === " " ? " " : CODE[(Math.random() * CODE.length) | 0];
        el.textContent = out;
        if (k < 1) requestAnimationFrame(step); else { el.textContent = final; el.removeAttribute("aria-label"); }
      })(start);
    });
  }, {rootMargin:"0px 0px -15% 0px"});
  root.querySelectorAll("h2").forEach(function(h){ decodeIO.observe(h); });
}

render();

})();
</script>
</body>
